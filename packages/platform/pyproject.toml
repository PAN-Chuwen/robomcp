[project]
name = "robomcp-platform"
version = "0.1.0"
description = "RoboMCP platform backend: orgs, projects, experiments, Postgres job queue, sim workers"
requires-python = ">=3.12"
dependencies = [
    "robomcp",
    "alembic>=1.20.1",
    "boto3>=1.43.117",
    "fastapi>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
robomcp = { workspace = true }

[project.scripts]
robomcp-platform = "robomcp_platform.cli:main"
robomcp-worker = "robomcp_platform.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robomcp_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Postgres server (creates and drops a throwaway database)"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
