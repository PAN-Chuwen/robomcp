[project]
name = "robomcp"
version = "0.1.0"
description = "MCP tools that let any LLM agent drive an SO-101 robot arm (MuJoCo sim, real arm next)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "mink>=1.3.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pillow>=12.3.0",
]

[project.scripts]
robomcp-server = "robomcp.server:main"
robomcp-agent = "robomcp.agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robomcp"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "anthropic>=1.17.0",
    "pytest>=9.1.1",
]
